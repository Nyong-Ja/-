<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뇽스모 - 파스모포비아 전문 정보 & 공략 사이트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- 상단 헤더 레이아웃 (좌: 타이틀 / 중: 메뉴 탭 / 우: 스타일 검색창) -->
        <div class="title-section">
            <div class="title-left">
                <div class="sub-title">INTERACTIVE CHEAT SHEET & WIKI DATABASE</div>
                <h1 id="page-main-title">뇽스모 - 파스모포비아 전문 정보 & 공략 사이트</h1>
                <p id="page-main-desc">발견한 증거를 클릭(포함/제외)하여 남은 유령을 빠르게 추려내세요.</p>
            </div>
            
            <!-- 중앙 네비게이션 메뉴 탭 -->
            <nav class="top-nav">
                <button class="nav-tab active" data-tab="evidence" onclick="switchTab('evidence')">증거 분석</button>
                <button class="nav-tab" data-tab="news" onclick="switchTab('news')">패치 소식</button>
                <button class="nav-tab" data-tab="ghosts" onclick="switchTab('ghosts')">유령 도감</button>
                <button class="nav-tab" data-tab="equipment" onclick="switchTab('equipment')">장비 가이드</button>
                <button class="nav-tab" data-tab="weekly" onclick="switchTab('weekly')">주간 도전 과제</button>
                <button class="nav-tab" data-tab="idcard" onclick="switchTab('idcard')">ID 카드</button>
                <button class="nav-tab" data-tab="maps" onclick="switchTab('maps')">맵 정보</button>
                <button class="nav-tab" data-tab="guide" onclick="switchTab('guide')">공략 / 정보</button>
            </nav>

            <!-- 우측 상단 박스 검색창 -->
            <div class="top-search-bar">
                <input type="text" placeholder="유령 이름 또는 특징 검색 (예: 데오겐, 향, 소금)..." onkeyup="handleHeaderSearch(this.value)" onclick="openSearchPanel()">
            </div>
        </div>

        <!-- 1. 증거 분석 탭 뷰 -->
        <div id="tab-evidence" class="tab-content active">
            <div class="content-wrapper">
                <div class="left-panel">
                    <div class="panel-header">
                        <h2>증거 선택 (Evidence)</h2>
                        <button id="reset-btn">초기화 ↺</button>
                    </div>
                    
                    <div class="guide-text">
                        * 1번 클릭: <span class="badge state-include">포함</span> | 2번 클릭: <span class="badge state-exclude">제외</span> | 3번 클릭: 미선택
                    </div>

                    <div class="evidence-grid">
                        <button class="evidence-btn" data-evidence="EMF 5">EMF 5단계</button>
                        <button class="evidence-btn" data-evidence="DOTS">D.O.T.S 프로젝트</button>
                        <button class="evidence-btn" data-evidence="손자국">자외선 (손자국)</button>
                        <button class="evidence-btn" data-evidence="고스트 오브">고스트 오브</button>
                        <button class="evidence-btn" data-evidence="고스트 라이팅">고스트 라이팅</button>
                        <button class="evidence-btn" data-evidence="스피릿 박스">스피릿 박스</button>
                        <button class="evidence-btn" data-evidence="서늘함">서늘함</button>
                    </div>

                    <div class="info-notice">
                        ※ 미믹(Mimic)은 기본 증거 외에 항상 <strong>'고스트 오브'</strong>를 추가로 보여줍니다.
                    </div>
                </div>

                <div class="right-panel">
                    <div class="result-header">
                        <div class="result-header-left">
                            <span>추정 가능한 유령</span>
                            <div class="special-filters">
                                <label class="filter-chip">
                                    <input type="checkbox" id="filter-accel" onchange="toggleFilter('hasAccel')">
                                    <span>🚀 가속도 유령</span>
                                </label>
                                <label class="filter-chip">
                                    <input type="checkbox" id="filter-special-speed" onchange="toggleFilter('hasSpecialSpeed')">
                                    <span>⚡ 특수 속도 유령</span>
                                </label>
                                <label class="filter-chip">
                                    <input type="checkbox" id="filter-forced" onchange="toggleFilter('hasForcedEv')">
                                    <span>📌 고정 증거 보유</span>
                                </label>
                                <label class="filter-chip">
                                    <input type="checkbox" id="filter-roam" onchange="toggleFilter('hasTargetRoam')">
                                    <span>🎯 타겟 로밍 / 이동</span>
                                </label>
                            </div>
                        </div>
                        <span class="count-badge"><strong id="ghost-count">29</strong>종 남음</span>
                    </div>

                    <div id="ghost-list-container" class="ghost-list">
                        <!-- JS 생성 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 패치 소식 탭 뷰 -->
        <div id="tab-news" class="tab-content">
            <div class="guide-grid" id="news-container">
                <!-- JS 생성 -->
            </div>
        </div>

        <!-- 3. 유령 도감 탭 뷰 -->
        <div id="tab-ghosts" class="tab-content">
            <div class="ghost-dict-grid" id="ghost-dictionary-container">
                <!-- JS 생성 -->
            </div>
        </div>

        <!-- 4. 장비 가이드 탭 뷰 -->
        <div id="tab-equipment" class="tab-content">
            <div class="equipment-grid" id="equipment-container">
                <!-- JS 생성 -->
            </div>
        </div>

        <!-- 5. 주간 도전 과제 탭 뷰 -->
        <div id="tab-weekly" class="tab-content">
            <div class="guide-grid" id="weekly-container">
                <!-- JS 생성 -->
            </div>
        </div>

        <!-- 6. ID 카드 탭 뷰 -->
        <div id="tab-idcard" class="tab-content">
            <div class="equipment-grid" id="idcard-container">
                <!-- JS 생성 -->
            </div>
        </div>

        <!-- 7. 맵 정보 탭 뷰 -->
        <div id="tab-maps" class="tab-content">
            <div class="map-filter-bar">
                <button class="map-filter-btn active" onclick="filterMapCategory('ALL')">전체 맵</button>
                <button class="map-filter-btn" onclick="filterMapCategory('Small')">소형 (Small)</button>
                <button class="map-filter-btn" onclick="filterMapCategory('Medium')">중형 (Medium)</button>
                <button class="map-filter-btn" onclick="filterMapCategory('Large')">대형 (Large)</button>
            </div>
            <div class="maps-grid" id="maps-container">
                <!-- JS 생성 -->
            </div>
        </div>

        <!-- 8. 공략 / 정보 탭 뷰 -->
        <div id="tab-guide" class="tab-content">
            <div class="guide-grid" id="guide-container">
                <!-- JS 생성 -->
            </div>
        </div>
    </div>

    <!-- 우측 고정 퀵 메뉴 아이콘 바 -->
    <div class="quick-sidebar-bar">
        <button class="quick-icon-btn search-btn" onclick="toggleQuickPanel('search')" title="유령 특성 빠른 검색">🔍</button>
        <button class="quick-icon-btn" onclick="toggleQuickPanel('news')" title="공지사항/소식">📢</button>
        <button class="quick-icon-btn" onclick="toggleQuickPanel('stream')" title="방송 보러가기">📺</button>
        <button class="quick-icon-btn" onclick="toggleQuickPanel('community')" title="커뮤니티">💬</button>
        <button class="quick-icon-btn" onclick="toggleQuickPanel('contact')" title="문의 / 연락처">✉️</button>
    </div>

    <!-- 오른쪽에서 열리는 슬라이드 패널 -->
    <aside id="quick-slide-panel" class="quick-slide-panel">
        <div class="panel-header">
            <h3 id="quick-panel-title">공지사항</h3>
            <button class="close-btn" onclick="closeQuickPanel()">✕</button>
        </div>
        <div id="quick-panel-content" class="panel-content">
            <!-- JS 내용 -->
        </div>
    </aside>

    <footer>
        © 2026 뇽스모 - Phasmophobia Interactive CheatSheet & Encyclopedia
    </footer>

    <script src="script.js"></script>
</body>
</html>
